# ------------------------
# Server Configuration
# ------------------------
server.port=8443
server.servlet.session.timeout=1200s
spring.main.allow-bean-definition-overriding=true
spring.mvc.async.request-timeout=15000
spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB

# ------------------------
# MySQL Configuration
# ------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/fretchain?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=fretchain_user
spring.datasource.password=Fretchain@2026#Db
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

